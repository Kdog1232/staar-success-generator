<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Live Lesson</title>
  <style>
    :root {
      --bg: #f5f3ff;
      --bg-soft: #fafaff;
      --card: #ffffff;
      --ink: #172033;
      --muted: #68738a;
      --purple: #6d28d9;
      --purple-soft: #ede9fe;
      --purple-mid: #8b5cf6;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --orange-soft: #fff7ed;
      --orange-border: #fed7aa;
      --border: #d7dbea;
      --shadow: 0 24px 70px rgba(45, 34, 89, 0.13);
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(124, 92, 255, 0.18), transparent 30%),
        radial-gradient(circle at 92% 18%, rgba(45, 212, 191, 0.16), transparent 28%),
        linear-gradient(180deg, #fbfaff 0%, var(--bg) 100%);
    }

    .student-shell {
      width: min(900px, calc(100% - 28px));
      margin: 40px auto;
      padding: 32px;
      border: 1px solid rgba(124, 92, 255, 0.12);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      animation: fadeUp 0.42s ease both;
    }

    .top-bar {
      position: sticky;
      top: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -18px 24px;
      padding: 12px 14px;
      border: 1px solid rgba(124, 92, 255, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 26px rgba(76, 29, 149, 0.08);
    }

    .brand-lockup {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .brand-lockup span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      border: 1px solid rgba(22, 163, 74, 0.22);
      border-radius: 999px;
      color: #166534;
      background: var(--green-soft);
      font-size: 0.86rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .hero {
      display: grid;
      gap: 8px;
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #1f1744;
      font-size: clamp(2.1rem, 6vw, 3.7rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    .subtitle {
      max-width: 52ch;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      font-weight: 700;
    }

    .join-panel {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin: 0 auto 20px;
      padding: 18px;
      border: 1px solid rgba(215, 219, 234, 0.8);
      border-radius: 22px;
      background: var(--bg-soft);
      box-shadow: var(--shadow-soft);
    }

    .field {
      display: grid;
      gap: 7px;
      text-align: left;
    }

    .field label {
      color: #4c1d95;
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    input[type="text"]:focus {
      border-color: #7c5cff;
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
      transform: translateY(-1px);
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 950;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(109, 40, 217, 0.18);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .primary-btn {
      min-height: 52px;
      color: #ffffff;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9 58%, #4c1d95);
      box-shadow: 0 14px 30px rgba(109, 40, 217, 0.24);
      white-space: nowrap;
    }

    .secondary-btn {
      color: #9a3412;
      background: var(--orange-soft);
      border: 1px solid var(--orange-border);
    }

    .progress-wrap {
      display: none;
      gap: 8px;
      margin: 18px 0 24px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 900;
    }

    .progress-track {
      overflow: hidden;
      height: 12px;
      border-radius: 999px;
      background: #e9e7f5;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b5cf6, #22c55e);
      transition: width 0.25s ease;
    }

    #status {
      margin: 14px 0 0;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
    }

    #status.success-card,
    .waiting-card {
      padding: 16px 18px;
      border-radius: 18px;
      text-align: left;
      animation: fadeUp 0.28s ease both;
    }

    #status.success-card {
      color: #14532d;
      border: 1px solid rgba(22, 163, 74, 0.2);
      background: var(--green-soft);
      box-shadow: 0 12px 28px rgba(22, 163, 74, 0.08);
    }

    #status.error-card {
      color: #991b1b;
      padding: 14px 16px;
      border: 1px solid #fecaca;
      border-radius: 16px;
      background: #fff1f2;
    }

    .waiting-card {
      display: none;
      margin-top: 16px;
      color: #4c1d95;
      border: 1px solid rgba(139, 92, 246, 0.24);
      background: #f5f3ff;
      font-weight: 900;
    }

    #questions {
      display: grid;
      gap: 20px;
      margin-top: 22px;
    }

    .lesson-section {
      display: grid;
      gap: 14px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 0;
      color: #4c1d95;
      font-size: 1.2rem;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .passage-card {
      padding: 24px;
      border: 1px solid rgba(124, 92, 255, 0.14);
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 12px 36px rgba(31, 23, 68, 0.07);
    }

    .passage-card h2 {
      margin: 0 0 12px;
      color: #1f1744;
      font-size: 1.25rem;
    }

    .passage-copy {
      max-width: 70ch;
      color: #283447;
      font-size: 1.08rem;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .question-card {
      padding: 20px;
      border: 1px solid rgba(215, 219, 234, 0.9);
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      animation: fadeUp 0.34s ease both;
    }

    .question-label {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #4c1d95;
      background: var(--purple-soft);
      font-size: 0.8rem;
      font-weight: 950;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .question-card p {
      margin: 0 0 14px;
      color: #172033;
      font-size: 1.08rem;
      line-height: 1.55;
      font-weight: 850;
    }

    .answer-list {
      display: grid;
      gap: 10px;
    }

    .answer-choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid #e1e5f0;
      border-radius: 16px;
      background: #fbfcff;
      color: #263247;
      font-weight: 750;
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }

    .answer-choice:hover {
      border-color: #c4b5fd;
      background: #faf5ff;
      transform: translateY(-1px);
    }

    .answer-choice:has(input:checked) {
      border-color: var(--purple-mid);
      background: #f4f0ff;
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.12);
    }

    .answer-choice input {
      margin-top: 3px;
      accent-color: var(--purple);
    }

    .action-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(215, 219, 234, 0.9);
    }

    #submit {
      min-width: 190px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .student-shell {
        width: min(100% - 20px, 900px);
        margin: 12px auto;
        padding: 22px;
        border-radius: 20px;
      }

      .top-bar {
        position: static;
        margin: -8px -8px 20px;
        align-items: flex-start;
        flex-direction: column;
      }

      .join-panel {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .primary-btn,
      #submit,
      .secondary-btn {
        width: 100%;
      }

      .action-row {
        align-items: stretch;
        flex-direction: column;
      }

      .passage-card,
      .question-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="student-shell">
    <header class="top-bar">
      <div class="brand-lockup"><strong>STAAR Success Live</strong><span id="student-session-label">Ready to join</span></div>
      <div class="live-badge">🟢 Live Classroom Session</div>
    </header>

    <section class="hero">
      <h1>Join Your Live Lesson</h1>
      <p class="subtitle">Enter your class code and complete today's practice in a focused, calm workspace.</p>
    </section>

    <section id="join-panel" class="join-panel" aria-label="Join live class">
      <div class="field">
        <label for="code">Class code</label>
        <input id="code" type="text" inputmode="numeric" placeholder="6-digit class code" autocomplete="off">
      </div>
      <div class="field">
        <label for="student">Your name</label>
        <input id="student" type="text" placeholder="Your name" autocomplete="name">
      </div>
      <button id="join-btn" class="primary-btn" type="button">Join Live Lesson</button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="waiting" class="waiting-card">✨ You’re in! Waiting for your teacher to start the lesson...</div>

    <section id="progress-wrap" class="progress-wrap" aria-label="Lesson progress">
      <div class="progress-meta"><span id="progress-label">Question 0 of 0</span><span id="progress-percent">0%</span></div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </section>

    <form id="questions" aria-label="Live lesson questions"></form>

    <div id="lesson-actions" class="action-row">
      <button id="raise-hand" class="secondary-btn" type="button">✋ Raise Hand</button>
      <button id="submit" class="primary-btn" type="button">Submit Answers</button>
    </div>
  </main>

  <script type="module">
console.log("🔥 SCRIPT LOADED");
window.addEventListener("error", (e) => {
  console.error("GLOBAL ERROR:", e.error || e.message);
});

window.addEventListener("unhandledrejection", (e) => {
  console.error("PROMISE ERROR:", e.reason);
});
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL = "https://qadfehickkkvirtcnska.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZGZlaGlja2trdmlydGNuc2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NTQ0NTcsImV4cCI6MjA5MTIzMDQ1N30.G9YhkEije7yI7rCC2nFfZ5j1btUUIci81VZhLQ48JJ4";
const studentSupabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false },
  global: {
    fetch: (url, options) => {
      console.log("🌐 FETCH:", { url, options });
      return fetch(url, options);
    }
  }
});
let currentSession = null;
let hasSubmitted = false;
let sessionStatusChannel = null;
let sessionStatusInterval = null;
let lessonStarted = false;
let handRaised = false;
let totalQuestionCount = 0;

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setStatus(message, type = "default") {
  const status = document.getElementById("status");
  if (!status) return;
  status.className = type === "success" ? "success-card" : (type === "error" ? "error-card" : "");
  status.innerHTML = message;
}

function updateSessionLabel(text) {
  const label = document.getElementById("student-session-label");
  if (label) label.textContent = text;
}

function showLessonActions(show = true) {
  const actions = document.getElementById("lesson-actions");
  if (actions) actions.style.display = show ? "flex" : "none";
}

function updateProgress() {
  const wrap = document.getElementById("progress-wrap");
  const label = document.getElementById("progress-label");
  const percentLabel = document.getElementById("progress-percent");
  const bar = document.getElementById("progress-bar");
  if (!wrap || !label || !percentLabel || !bar || !totalQuestionCount) return;
  const answered = new Set(Array.from(document.querySelectorAll('#questions input[type="radio"]:checked')).map((input) => input.name)).size;
  const percent = Math.round((answered / totalQuestionCount) * 100);
  wrap.style.display = "grid";
  label.textContent = `Question ${Math.min(answered + 1, totalQuestionCount)} of ${totalQuestionCount}`;
  percentLabel.textContent = `${percent}%`;
  bar.style.width = `${percent}%`;
}

async function joinSession(code, studentName) {
  const joinTraceId = `join-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  console.log("[joinSession] START", { joinTraceId, code, studentName });
  try {
    console.log("[joinSession] BEFORE session lookup", { joinTraceId, code });
    const { data: session, error: sessionError, status: sessionStatus, statusText: sessionStatusText } = await studentSupabase
      .from("sessions")
      .select("id,lesson_id,code,is_active,status,allow_join")
      .eq("code", code)
      .single();
    console.log("[joinSession] AFTER session lookup", { joinTraceId, session, sessionError, sessionStatus, sessionStatusText });
    if (sessionError) {
      console.error("[joinSession] Session lookup failed", { joinTraceId, sessionError, code });
      throw new Error(`Session lookup failed (${sessionError.message || "unknown error"}).`);
    }
    if (!session) {
      console.error("[joinSession] Session lookup returned null", { joinTraceId, code });
      throw new Error("Session not found.");
    }
    const { data: { session: authSession }, error: authError } = await studentSupabase.auth.getSession();
    if (authError) {
      console.error("[joinSession] Auth session check failed", { joinTraceId, authError });
      throw new Error(`Auth session check failed (${authError.message || "unknown error"}).`);
    }
    if (!authSession) console.warn("[joinSession] No authenticated Supabase session (anon user)", { joinTraceId });
    console.log("🔥 ABOUT TO INSERT PARTICIPANT", { joinTraceId, sessionCode: session.code, studentName });
    const insertAbortController = new AbortController();
    const insertTimeoutId = setTimeout(() => insertAbortController.abort("Join insert timed out after 5000ms."), 5000);
    console.log("[joinSession] BEFORE insert", { joinTraceId, sessionCode: session.code, studentName });
    const { data: joinData, error: joinError, status: joinStatus, statusText: joinStatusText } = await studentSupabase
      .from("participants")
      .insert([{ session_id: session.id, session_code: session.code, student_name: studentName }])
      .select("id,session_id,session_code,student_name,joined_at")
      .abortSignal(insertAbortController.signal);
    clearTimeout(insertTimeoutId);
    console.log("[joinSession] AFTER insert", { joinTraceId, joinData, joinError, joinStatus, joinStatusText });
    if (joinError) {
      const errorMessage = (joinError.message || "").toLowerCase();
      const details = (joinError.details || "").toLowerCase();
      const hint = (joinError.hint || "").toLowerCase();
      const isRlsLikely = errorMessage.includes("row-level security") || details.includes("row-level security") || hint.includes("policy") || joinError.code === "42501";
      if (isRlsLikely) {
        console.error("[joinSession] RLS rejection while inserting participant", { joinTraceId, joinError });
        throw new Error(`Join rejected by RLS policy (${joinError.message || "policy denied"}).`);
      }
      console.error("[joinSession] Participant insert failed", { joinTraceId, joinError });
      throw new Error(`Unable to join session (${joinError.message || "insert failed"}).`);
    }
    console.log("[joinSession] SUCCESS", { joinTraceId, participant: joinData });
    return session;
  } catch (err) {
    const maybeNetworkOffline = typeof navigator !== "undefined" && navigator && navigator.onLine === false;
    console.error("[joinSession] CATCH", { joinTraceId, error: err, networkOffline: maybeNetworkOffline });
    if (maybeNetworkOffline) throw new Error("Network appears offline. Check connection and try again.");
    if (err instanceof Error && err.name === "AbortError") throw new Error("Join insert timed out after 5000ms.");
    if (err instanceof Error) throw err;
    throw new Error("Unknown join error.");
  } finally {
    console.log("[joinSession] FINALLY", { joinTraceId, code, studentName });
  }
}

async function startStudentLesson() {
  if (lessonStarted || !currentSession) return;
  lessonStarted = true;
  clearSessionStatusPolling();
  const { data: lessonRow, error } = await studentSupabase.from("lessons").select("data").eq("id", currentSession.lesson_id).maybeSingle();
  const lessonData = extractLessonData(lessonRow);
  console.log("LESSON LOOKUP:", { lessonRow, lessonData, error, currentSession });
  if (error || !lessonData) {
    lessonStarted = false;
    setStatus("No questions available.", "error");
    return;
  }
  if (renderQuestions(lessonData) !== false) {
    setStatus("🟢 Class is live. Answer each question, then submit when you’re ready.");
  }
}

function clearSessionStatusPolling() {
  if (sessionStatusInterval) {
    clearInterval(sessionStatusInterval);
    sessionStatusInterval = null;
  }
}

async function checkSessionStatus() {
  if (!currentSession || lessonStarted) return;
  const { data: session, error } = await studentSupabase.from("sessions").select("status").eq("code", currentSession.code).single();
  if (error) {
    console.error("[checkSessionStatus] Session status lookup failed", { error, currentSession });
    return;
  }
  console.log("SESSION STATUS CHECK:", session);
  if (session?.status === "live") await startStudentLesson();
}

function subscribeToSessionStatus(code) {
  if (sessionStatusChannel) studentSupabase.removeChannel(sessionStatusChannel);
  clearSessionStatusPolling();
  sessionStatusChannel = studentSupabase
    .channel(`session-${code}`)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "sessions", filter: `code=eq.${code}` }, (payload) => {
      console.log("SESSION UPDATE:", payload);
      if (payload.new?.status === "live") startStudentLesson();
    })
    .subscribe((status) => {
      console.log("SESSION CHANNEL STATUS:", status);
    });
  sessionStatusInterval = setInterval(checkSessionStatus, 2000);
}

function extractLessonData(lesson) {
  let data = lesson?.data || lesson;
  if (typeof data === "string") {
    try {
      data = JSON.parse(data);
    } catch (parseError) {
      console.error("Unable to parse lesson data JSON", parseError);
      return null;
    }
  }
  return data && typeof data === "object" ? data : null;
}

function getQuestionSection(data, sectionName) {
  const section = data?.[sectionName] || {};
  return { passage: section?.passage || "", questions: Array.isArray(section?.questions) ? section.questions : [] };
}

function renderPassage(title, passage) {
  if (!passage) return "";
  return `
    <article class="passage-card">
      <h2>${escapeHtml(title)}</h2>
      <div class="passage-copy">${escapeHtml(passage)}</div>
    </article>
  `;
}

function renderQuestionCard(question, sectionPrefix, displayIndex, localIndex) {
  const choices = Array.isArray(question.choices) ? question.choices : [];
  return `
    <article class="question-card" style="animation-delay:${Math.min(displayIndex * 0.02, 0.22)}s">
      <span class="question-label">Question ${displayIndex}</span>
      <p>${escapeHtml(question.question || "")}</p>
      <div class="answer-list">
        ${choices.map((choice, idx) => {
          const letter = String.fromCharCode(65 + idx);
          const choiceText = typeof choice === "string" ? choice : (choice?.text || "");
          return `
            <label class="answer-choice">
              <input type="radio" name="${sectionPrefix}${localIndex}" value="${letter}">
              <span><strong>${letter}.</strong> ${escapeHtml(choiceText)}</span>
            </label>
          `;
        }).join("")}
      </div>
    </article>
  `;
}

function renderQuestions(lesson) {
  const qf = document.getElementById("questions");
  const submitBtn = document.getElementById("submit");
  const waiting = document.getElementById("waiting");
  const data = extractLessonData(lesson);
  const practiceSection = getQuestionSection(data, "practice");
  const crossSection = getQuestionSection(data, "cross");
  const practice = practiceSection.questions;
  const cross = crossSection.questions;
  const practicePassage = practiceSection.passage || data?.passage || "";
  const crossPassage = crossSection.passage || "";
  console.log("RENDER LESSON DATA:", { data, practiceQuestions: practice.length, crossQuestions: cross.length, practicePassage: !!practicePassage, crossPassage: !!crossPassage });
  totalQuestionCount = practice.length + cross.length;
  if (!practice.length && !cross.length) {
    qf.innerHTML = "";
    submitBtn.disabled = true;
    showLessonActions(false);
    setStatus("No questions available.", "error");
    return false;
  }
  qf.innerHTML = `
    <section class="lesson-section">
      ${renderPassage("Practice Passage", practicePassage)}
      ${practice.length ? `<h2 class="section-title">Practice Questions</h2>` : ""}
      ${practice.map((question, index) => renderQuestionCard(question, "p", index + 1, index)).join("")}
    </section>
    <section class="lesson-section">
      ${renderPassage("Cross-Curricular Passage", crossPassage)}
      ${cross.length ? `<h2 class="section-title">Cross-Curricular Questions</h2>` : ""}
      ${cross.map((question, index) => renderQuestionCard(question, "c", practice.length + index + 1, index)).join("")}
    </section>
  `;
  waiting.style.display = "none";
  showLessonActions(true);
  submitBtn.disabled = false;
  updateSessionLabel(`Code ${currentSession?.code || ""}`.trim());
  updateProgress();
  return true;
}

document.addEventListener("DOMContentLoaded", () => {
  const joinBtn = document.getElementById("join-btn");
  const questions = document.getElementById("questions");
  questions?.addEventListener("change", updateProgress);

  joinBtn.addEventListener("click", async () => {
    const codeInput = document.getElementById("code");
    const studentInput = document.getElementById("student");
    const waiting = document.getElementById("waiting");
    if (!codeInput || !studentInput) {
      console.error("❌ Inputs not found in DOM");
      alert("Page error. Refresh and try again.");
      return;
    }
    const code = codeInput.value.trim();
    const student = studentInput.value.trim();
    console.log("🚀 JOIN CLICKED", { code, name: student });
    if (!code || !student) {
      alert("Enter code and name");
      setStatus("Enter your class code and name to join.", "error");
      return;
    }
    if (hasSubmitted) {
      setStatus("✅ You already submitted. Wait for your teacher.", "success");
      return;
    }
    joinBtn.disabled = true;
    joinBtn.textContent = "Joining...";
    setStatus("Joining your live lesson...");
    try {
      const session = await joinSession(code, student);
      currentSession = { id: session.id, lesson_id: session.lesson_id, code: session.code, student };
      updateSessionLabel(`Code ${session.code}`);
      document.getElementById("join-panel")?.setAttribute("hidden", "");
      lessonStarted = false;
      subscribeToSessionStatus(session.code);
      if (session.status === "lobby") {
        waiting.style.display = "block";
        setStatus("✅ Joined! Your teacher will start soon.", "success");
        alert("✅ Joined!");
        return;
      }
      await startStudentLesson();
      alert("✅ Joined!");
    } catch (err) {
      console.error("❌ JOIN FAILED:", err);
      setStatus(escapeHtml(err.message || "Something went wrong. Try again."), "error");
      alert(err.message || "Join failed.");
    } finally {
      joinBtn.disabled = false;
      joinBtn.textContent = "Join Live Lesson";
    }
  });

  document.getElementById("raise-hand").onclick = async () => {
    const handBtn = document.getElementById("raise-hand");
    if (!currentSession || handRaised) return;
    const message = prompt("What do you need help with? (Example: Question 4)", "Question ");
    handBtn.disabled = true;
    handBtn.textContent = "Hand Raised";
    try {
      const { error } = await studentSupabase.from("help_requests").insert({
        session_id: currentSession.id,
        student_name: currentSession.student,
        message: message || "Student raised their hand."
      });
      if (error) throw error;
      handRaised = true;
      setStatus("✋ Hand raised. Your teacher can see you need help.", "success");
    } catch (e) {
      console.error(e);
      const duplicate = e?.code === "23505" || String(e?.message || "").toLowerCase().includes("duplicate");
      if (duplicate) {
        handRaised = true;
        handBtn.disabled = true;
        handBtn.textContent = "Hand Raised";
        setStatus("✋ Your hand is already raised. Your teacher can see it.", "success");
        return;
      }
      setStatus("Could not raise hand. Try again.", "error");
      handBtn.disabled = false;
      handBtn.textContent = "✋ Raise Hand";
    }
  };

  document.getElementById("submit").onclick = async () => {
    const submitBtn = document.getElementById("submit");
    if (!currentSession || hasSubmitted) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    try {
      const answers = {};
      document.querySelectorAll('input[type="radio"]:checked').forEach((input) => {
        answers[input.name] = input.value;
      });
      await studentSupabase.from("responses").insert({ session_id: currentSession.id, student_name: currentSession.student, answers });
      hasSubmitted = true;
      document.querySelectorAll("input").forEach((input) => { input.disabled = true; });
      setStatus("✅ Submitted!<br>Wait for your teacher’s instructions.", "success");
      submitBtn.textContent = "Submitted";
      updateProgress();
    } catch (e) {
      console.error(e);
      setStatus("Submit failed. Try again.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Answers";
    }
  };
});
  </script>
</body>
</html>
